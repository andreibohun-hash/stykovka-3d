<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стыковка 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f2e">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Шрифт файлом рядом (PROTO-BASE §1/§11): Nunito, переменная насыщенность 200–1000, кириллица и латиница. Лицензия OFL. */
@font-face{font-family:Nunito;font-weight:200 1000;font-display:swap;src:url('assets/fonts/nunito-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Nunito;font-weight:200 1000;font-display:swap;src:url('assets/fonts/nunito-cyr.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
/* Палитра интерфейса — одно место (§9); 2D-слой эффектов читает цвета через getComputedStyle. Арт-библия — DESIGN.md. */
:root{
  --space:#0b0f2e; --ink:#f4f6ff; --muted:#a9b3e6; --navy:#1b2356; --navy2:#2a3577; --rim:#6f8cff;
  --orange:#ff8a1f; --orange2:#ffb347; --gold:#ffc130; --cyan:#46e6ff; --solar:#ffd23d; --truss:#ff9a3d;
  --ok:#5cf28a; --bad:#ff5a6e; --lamp:#ffd36b; --cool:#59c8ff; --gate:#b07bff;
  --frame-w:440px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05071a;color:var(--ink);font:800 16px/1.25 Nunito, system-ui, sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;overflow:hidden;
  background:var(--space) url('assets/bg1.jpg') center bottom/cover no-repeat;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#frame[data-ch="2"]{background-image:url('assets/bg2.jpg')}
/* ---------- HUD: капсула GPT (panel-hud) как 9-slice; v1.1 — одна строка 48 px: цель, имя вещи с прогрессом, батарейки, звук ---------- */
header{position:relative;z-index:3;margin:6px 5px 0;display:flex;align-items:center;gap:7px;min-height:48px;padding:0;pointer-events:none;
  border-style:solid;border-width:14px 16px;border-image:url('assets/ui/panel-hud.png') 44 52 fill / 14px 16px / 0 stretch;margin-top:max(6px,env(safe-area-inset-top))}
header > *{margin:-11px 0}
#hud-goal{pointer-events:auto;width:44px;height:44px;flex:none;margin-left:-8px;border-radius:12px;background:radial-gradient(#2a3577,#141a45);box-shadow:inset 0 0 0 2px #34418c;overflow:hidden}
#hud-goal img{width:100%;height:100%;object-fit:contain;display:block;transform:scale(1.25)}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:stretch}
#hud-obj{font-weight:900;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#hud-obj i{font-style:normal;color:var(--muted);margin-right:5px}
#hud-obj.long{font-size:12.5px}
.prog-row{display:flex;align-items:center;gap:6px}
#prog{flex:1;height:11px;border-radius:8px;background:#0c1238;box-shadow:inset 0 2px 3px rgba(0,0,0,.5),0 0 0 2px #3a4a9c;overflow:hidden}
#prog-fill{height:100%;width:0;border-radius:8px;background:linear-gradient(#ffd27a,#ff8a1f 70%);transition:width .25s}
#prog.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.04,1.25)}}
#prog-n{font-weight:900;font-size:12.5px;color:var(--gold);min-width:30px;text-align:right;text-shadow:0 1px 0 rgba(0,0,0,.5)}
#bats{display:flex;gap:2px}
#bats i{width:16px;height:26px;background:url('assets/ui/bat-on.png') center/contain no-repeat}
#bats i.off{background-image:url('assets/ui/bat-off.png')}
#bats i.blink{animation:blink .5s 2}
@keyframes blink{50%{transform:scale(1.35);filter:brightness(2) hue-rotate(-30deg)}}
#btn-mute{pointer-events:auto;width:40px;height:40px;flex:none;border:0;padding:0;margin-right:-6px;background:url('assets/ui/round-navy.png') center/contain no-repeat;display:grid;place-items:center}
#btn-mute img{width:22px;height:22px;pointer-events:none}
/* подпись под шапкой — только подсказка обучающего уровня; у остальных уровней строки нет, место отдано полю */
#banner{position:relative;z-index:2;text-align:center;padding:3px 14px 0;pointer-events:none}
/* цель уровня крупно: показывается на старте над полем и улетает в шапку; тап по цели в шапке показывает её снова */
#goal-big{position:absolute;z-index:2;left:50%;top:70px;width:136px;height:136px;margin-left:-68px;object-fit:contain;pointer-events:none;display:none;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.55))}
#goal-big.show{display:block;animation:goalfly 2.2s cubic-bezier(.5,0,.3,1) forwards}
@keyframes goalfly{0%{transform:scale(.85);opacity:1}8%{transform:scale(1.06)}14%{transform:scale(1)}66%{transform:scale(1);opacity:1}100%{transform:translate(var(--gx,-150px),var(--gy,-70px)) scale(.3);opacity:0}}
#banner small{display:inline-block;font-weight:800;font-size:13px;line-height:1.2;color:var(--cyan);text-shadow:0 1px 0 rgba(0,0,0,.6)}
/* ---------- поле: WebGL-сцена + 2D-слой эффектов (он же ловит касания) ---------- */
#game{position:absolute;inset:0;z-index:1;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none}
.spacer{flex:1}
/* ---------- кнопки GPT (btn-orange / btn-navy) как 9-slice ---------- */
footer{position:relative;z-index:3;display:flex;gap:6px;justify-content:center;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
.b{font:900 17px/1 Nunito, system-ui, sans-serif;color:#fff;text-shadow:0 2px 0 rgba(120,40,0,.45);min-height:56px;padding:0 10px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;background:none;border-style:solid;border-width:24px 28px;
  border-image:url('assets/ui/btn-orange.png') 52 64 fill / 24px 28px / 0 stretch;transition:transform .08s}
.b > *{margin:-20px 0}
.b.navy{border-image-source:url('assets/ui/btn-navy.png');text-shadow:0 2px 0 rgba(0,0,0,.45)}
.b img{width:26px;height:26px;pointer-events:none}
.b span{white-space:nowrap}
.b:active{transform:scale(.95)}
.b:disabled{filter:grayscale(.85) brightness(.7);cursor:default}
.b.pulse{animation:pulse .7s infinite}
@keyframes pulse{50%{transform:scale(1.07);filter:brightness(1.25)}}
footer .b{flex:1;min-width:0;font-size:15px;padding:0 4px;min-height:50px;border-width:21px 26px;border-image-width:21px 26px}
footer .b > *{margin:-17px 0}
footer .b img{width:23px;height:23px}
/* ---------- экраны: панель GPT (panel-card) как 9-slice ---------- */
#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(5,7,26,.5);padding:14px}
#overlay.show{display:flex}
#overlay.win{align-items:flex-end;background:linear-gradient(transparent 40%,rgba(5,7,26,.6));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.card{position:relative;width:100%;max-width:400px;max-height:calc(100% - 8px);overflow-y:auto;text-align:center;padding:4px 6px;
  border-style:solid;border-width:30px;border-image:url('assets/ui/panel-card.png') 60 fill / 30px / 0 stretch;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94)}to{transform:scale(1)}} /* стартует с видимого состояния (§9) */
.card h1{margin:-8px 0 2px;font-weight:1000;font-size:34px;letter-spacing:.5px;line-height:1;color:#fff;text-shadow:0 3px 0 #c25400,0 6px 12px rgba(0,0,0,.4)}
.card h1 span{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:10px;background:var(--orange);font-size:20px;vertical-align:6px;text-shadow:none;box-shadow:0 3px 0 #b35100}
.card h2{margin:-6px 0 6px;font-weight:1000;font-size:25px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.card p{color:var(--muted);margin:4px 0 12px;font-weight:800;font-size:15px}
.card .row{display:flex;gap:8px;justify-content:center;margin-top:8px}
.card .row .b{flex:1;min-width:0;font-size:15px;padding:0;border-width:24px 21px;border-image-width:24px 21px}
.emblem{width:96px;height:96px;margin:-6px auto 2px;display:block;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.shot{width:min(62vw,230px);height:min(62vw,230px);margin:-10px auto -6px;display:block;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 6px}
.levels button{position:relative;aspect-ratio:1;border:0;padding:0;background:url('assets/ui/round-navy.png') center/contain no-repeat;
  font:1000 18px/1 Nunito, system-ui, sans-serif;color:#fff;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.levels button.cur{background-image:url('assets/ui/round-orange.png')}
.levels button:disabled{cursor:default;color:transparent;text-shadow:none}
.levels button:disabled::after{content:'';position:absolute;inset:26%;background:url('assets/ui/ic-lock.png') center/contain no-repeat}
.levels .mini{position:absolute;left:0;right:0;bottom:-3px;display:flex;justify-content:center}
.levels .mini i{width:13px;height:13px;background:url('assets/ui/star-off.png') center/contain no-repeat}
.levels .mini i.on{background-image:url('assets/ui/star-on.png')}
.levels .ch{grid-column:1/-1;font-weight:900;font-size:13px;color:var(--muted);text-align:left;margin:4px 2px -2px}
.stars{display:flex;justify-content:center;gap:4px;margin:2px 0 6px}
.stars i{width:52px;height:52px;background:url('assets/ui/star-off.png') center/contain no-repeat}
.stars i:nth-child(2){transform:translateY(-8px) scale(1.12)}
.stars i.on{background-image:url('assets/ui/star-on.png')}
.stars i.pop{animation:starpop .45s cubic-bezier(.3,1.8,.5,1) backwards}
@keyframes starpop{from{transform:scale(.4)}}
.cheats{margin-top:6px}
.cheat{font:800 12px/1.2 Nunito, system-ui, sans-serif;padding:6px 10px;border-radius:10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted);cursor:pointer}
.help-list{text-align:left;margin:0 0 10px;padding-left:20px;color:var(--ink);font-weight:800;font-size:15px}
.help-list li{margin:6px 0}
.help-list b{color:var(--orange2)}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}
.hgrid div{position:relative;aspect-ratio:1;border-radius:14px;background:radial-gradient(#2a3577,#141a45);box-shadow:inset 0 0 0 2px #34418c}
.hgrid div img{position:absolute;left:4px;top:0;width:calc(100% - 8px);height:calc(100% - 30px);object-fit:contain}
.hgrid div.no img{opacity:.55}
.hgrid div span{position:absolute;left:3px;right:3px;bottom:5px;font-weight:900;font-size:11px;letter-spacing:-.2px;line-height:1.05;color:#fff;text-shadow:0 1px 2px #000;}
.hgrid div.no span{color:var(--muted)}
.count{display:inline-block;margin:0 0 4px;padding:3px 12px;border-radius:12px;background:#0c1238;box-shadow:inset 0 0 0 2px #3a4a9c;font-weight:900;font-size:15px;color:var(--gold)}
#toast{position:absolute;z-index:4;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:88%;text-align:center;
  background:rgba(16,22,64,.94);box-shadow:0 0 0 2px #4b63c9,0 6px 16px rgba(0,0,0,.4);padding:9px 14px;border-radius:14px;font-weight:800;font-size:14px;
  pointer-events:none;opacity:.98;transition:opacity .25s}
#toast.bad{box-shadow:0 0 0 2px var(--bad),0 6px 16px rgba(0,0,0,.4)}
#toast.hide{opacity:0}
#boot{position:absolute;inset:0;z-index:9;display:none;place-items:center;text-align:center;padding:30px;font-weight:800;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ #goal-big.show{display:none;animation:none} .card,.stars i.pop,#prog.bump,#bats i.blink,.b.pulse{animation:none} #toast,#prog-fill{transition:none} }
</style>
</head>
<body>
<div id="frame" data-ch="1">
  <div id="game"><canvas id="cv3"></canvas><canvas id="fx"></canvas></div>
  <header>
    <div id="hud-goal"></div>
    <div class="hud-mid"><span id="hud-obj"><i>1</i>Ракета</span><div class="prog-row"><div id="prog"><div id="prog-fill"></div></div><b id="prog-n">0/9</b></div></div>
    <div id="bats"><i></i><i></i><i></i></div>
    <button id="btn-mute" aria-label="звук"><img id="mute-ic" src="assets/ui/ic-sound.png" alt=""></button>
  </header>
  <div id="banner"></div>
  <img id="goal-big" alt="">
  <div class="spacer"></div>
  <footer>
    <button class="b" id="btn-undo"><img src="assets/ui/ic-undo.png" alt=""><span>Отмена</span></button>
    <button class="b navy" id="btn-reset"><img src="assets/ui/ic-restart.png" alt=""><span>Заново</span></button>
    <button class="b navy" id="btn-menu"><img src="assets/ui/ic-menu.png" alt=""><span>Меню</span></button>
  </footer>
  <div id="overlay"><div class="card" id="card"></div></div>
  <div id="toast" class="hide"></div>
  <div id="boot">3D не запустилось на этом устройстве (WebGL выключен). Попробуй другой браузер.</div>
</div>
<script src="vendor/three.js"></script>
<script src="assets/scene3d.js"></script>
<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Стыковка 3D». Правила — как в «Стыковке» v0.4 (~/Claude/Projects/stykovka), меняется источник уровней:
// чертёж — узнаваемый объект (ракета, спутник, станция с кольцом, лунный модуль, корабль…) из каталога OBJECTS.
// Поле w×h, ядро станции, пунктиром — чертёж (какие клетки и каким типом модуля заполнить). По краям — очереди
// модулей, у каждой своя линия (ряд или столбец) и сторона входа. Тап по очереди: передний модуль летит прямо по
// линии и встаёт в клетку перед первым занятым (станция, обломок, закрытое поле).
//   dock     — встал в пунктир своего типа: защёлкнулся, клетка заполнена;
//   crooked  — встал вне чертежа или не в свой тип: модуль отстёгивается и возвращается в очередь, −1 батарейка;
//   off      — ничего не задел, улетел: возвращается, −1 батарейка;
//   blocked  — линия занята у самого края (или застрял на отражателе): то же, что промах.
// Отмена последней стыковки — тоже −1 батарейка. Батарейки кончились — проигрыш.
// Тупик (чертёж уже не достроить) ядро видит сразу: dead = true.
// ---------------------------------------------------------------------------
const CFG = {
  // правила
  BATTERIES: 3,          // батареек на уровень (звёзды за победу = сколько осталось)
  MISS_COST: 1,          // цена промаха (мимо станции, вне чертежа, не тот тип)
  UNDO_COST: 1,          // цена отмены последней стыковки
  // солвер и боты
  SOLVE_CAP: 120000,     // предел узлов перебора; выше — «не знаем», тупик не объявляем
  NOVICE_RUNS: 300,      // партий бота-новичка на уровень в аудите
  // генератор уровней от формы объекта (genObject)
  GEN_TRIES: 40,         // попыток найти порядок постройки (порядок = решение) на одну расстановку препятствий
  GEN_LAYOUTS: 8,        // расстановок препятствий на один сид, если порядок не нашёлся
  GEN_QUEUE_W: 1.6,      // множитель веса для уже занятой очереди: чаще «второй встаёт дальше»
  GEN_DEBRIS_W: 2.5,     // множитель веса, если модуль встаёт об обломок: обломки участвуют в решении
  GEN_MIRROR_W: 3,       // множитель веса для полёта через отражатель
  GEN_GATE_W: 3,         // множитель веса для полёта сквозь открытое поле или упора в закрытое
  DEPTH_LR: 2,           // глубина очереди слева и справа (места по ширине мало)
  DEPTH_TB: 3,           // глубина очереди сверху и снизу
  DEBRIS_MIN_R: 2,       // обломок не ближе этого (по Чебышёву) к ядру
  OBS_WIDE: 5,           // объект шириной от стольких клеток не расширяет поле по горизонтали препятствиями (клетка крупнее)
  CROP_PAD: 0,           // запас пустых клеток вокруг станции после обрезки поля (v0.4: 1; в 3D поле вплотную — клетка крупнее)
  MAX_W: 6,              // ширина поля не больше (иначе клетка на телефоне мельчает; аудит проверяет)
  // ---- оболочка: анимация и ощущение (мс; расстояния — в клетках) ----
  FLY_CPS: 13,           // средняя скорость полёта модуля, клеток в секунду (разгон, потом торможение у шва)
  FLY_MIN_MS: 260,       // минимальная длительность полёта
  FLY_IMPACT: 0.6,       // скорость в момент касания (доля средней): удар чувствуется, но модуль уже затормозил
  APPROACH: 0.3,         // доля пути «подлёта»: модуль тормозит и чуть разворачивается, магнит доворачивает его при касании
  TWIST_RAD: 0.32,       // перекос модуля на подлёте (рад), магнит выправляет пружиной
  RETURN_MS: 420,        // модуль после промаха возвращается в очередь
  WOBBLE_MS: 300,        // покачивание кривого модуля перед возвратом
  SQUASH_MS: 220,        // сплющивание модуля от удара
  LATCH_MS: 260,         // лапы-защёлки обхватывают шов
  LATCH_HOLD_MS: 520,    // лапы видны после захвата, потом уходят в муфту
  WING_QUEUE: 0,         // раскрытие крыльев панели в очереди и в полёте: 0 — сложены стопкой на хабе (сверху — синяя панель в раме), 1 — раскрыты
  UNFOLD_MS: 340,        // раскрытие крыльев солнечной панели (начинается после защёлок)
  LIGHTS_MS: 300,        // в окнах загорается свет (начинается после защёлок)
  SHAKE_MS: 160,         // дрожь станции от стыковки
  SHAKE_U: 0.05,         // её амплитуда, клеток
  HITSTOP_MS: 50,        // стыковка: стоп-кадр в момент касания (игровое время стоит). Не чаще раза в HITSTOP_GAP_MS — быстрые серии не тормозит
  HITSTOP_GAP_MS: 250,   // стыковка раньше этого после прошлой идёт без стоп-кадра
  SQUASH_U: 0.34,        // стыковка: сжатие модуля вдоль оси (доля длины), дальше затухающий отскок
  KNOCK_U: 0.085,        // стыковка: толчок соседей станции вдоль удара, клеток (затухает с расстоянием от шва)
  KNOCK_WAVE_MS: 22,     // толчок идёт по станции волной: задержка на клетку
  WAVE_POP: 0.07,        // волна света по станции: модуль на миг крупнее на эту долю
  INTRO_MS: 800,         // появление уровня: чертёж волной от ядра, очереди подъезжают
  PRESS_SCALE: 0.9,      // модуль под пальцем поджимается
  TRAIL_GHOSTS: 3,       // шлейф летящего модуля (полупрозрачные копии позади)
  WORD_MS: 950,          // всплывающее слово
  STREAK_WORDS: { 3: 'Чётко!', 5: 'Ас стыковки!', 8: 'Космос!' },   // слова за серию стыковок без промаха
  PARTS_MAX: 320,        // предел частиц на экране
  CONFETTI_N: 70,        // конфетти на победе

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() в ядре не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function idxOf(w, x, y){ return y * w + x; }
// Поле для расчёта полёта: занятость, размеры, пороги полей и сколько стыковок уже было (поля открываются по ним).
function fieldOf(s){ return { occ: s.occ, w: s.w, h: s.h, gate: s.gate, docks: s.hist.length }; }
function blocks(f, i){ const v = f.occ[i]; return v !== EMPTY && !isMirror(v) && !(v === GATE && f.docks >= f.gate[i]); }
// Полёт модуля длиной len из очереди side+idx: идёт, пока следующая клетка свободна; отражатель поворачивает
// (ферму len 2 — нет: для неё отражатель как обломок). stop — передняя клетка, где встал (−1 — некуда встать или
// застрял на отражателе), cells — клетки модуля (для фермы передняя и задняя; задняя за краем — cells короче len),
// hit — во что упёрся (−1 — пролетел насквозь), path — пройденные клетки, turns — отражатели по пути, dir — итоговое направление.
function trace(f, side, idx, len){
  len = len || 1;
  let d = DIR[side].slice(), x = side === 'L' ? -1 : side === 'R' ? f.w : idx, y = side === 'T' ? -1 : side === 'B' ? f.h : idx;
  const path = [], turns = [], seen = new Set();
  for (;;){
    const nx = x + d[0], ny = y + d[1];
    if (nx < 0 || ny < 0 || nx >= f.w || ny >= f.h) return { stop: -1, hit: -1, path, turns, dir: d, cells: [] };
    const ni = idxOf(f.w, nx, ny), v = f.occ[ni], m = isMirror(v);
    if ((m && len > 1) || (!m && blocks(f, ni))){
      const last = path.length ? path[path.length - 1] : -1;
      if (last < 0 || isMirror(f.occ[last])) return { stop: -1, hit: ni, path, turns, dir: d, cells: [] };
      const cells = [last]; if (len > 1 && path.length > 1) cells.push(path[path.length - 2]);
      return { stop: last, hit: ni, path, turns, dir: d, cells };
    }
    path.push(ni); x = nx; y = ny;
    if (m){
      const key = ni * 8 + (d[0] + 1) * 3 + (d[1] + 1); if (seen.has(key)) return { stop: -1, hit: -1, path, turns, dir: d, cells: [], loop: true };
      seen.add(key); d = v === MIRROR_A ? [-d[1], -d[0]] : [d[1], d[0]]; turns.push(ni);
    }

}

function fits(bp, grp, kind, cells){

  return cells.length === 1 || (grp[cells[0]] > 0 && grp[cells[0]] === grp[cells[1]]);
}
function stationNb(occ, w, h, i){     // сколько соседей клетки — станция (ядро или модуль)
  const x = i % w, y = (i - x) / w; let n = 0;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
    const X = x + dx, Y = y + dy;
    if (X >= 0 && Y >= 0 && X < w && Y < h){ const v = occ[idxOf(w, X, Y)]; if (v === CORE || v > 0) n++; }
  }

}

const decoCells = (deco, w, ox, oy, flipW) => (deco || []).map(d => {
  const x = flipW ? flipW - 1 - d.c[0] : d.c[0];
  return { t: d.t, i: idxOf(w, x + ox, d.c[1] + oy), d: flipW && (d.d === 'L' || d.d === 'R') ? (d.d === 'L' ? 'R' : 'L') : d.d };

function parseMap(L){
  const h = L.map.length, w = L.map[0].length, N = w * h, bp = new Array(N).fill(0), grp = new Array(N).fill(0), gate = new Array(N).fill(0);
  const base = new Array(N).fill(EMPTY), core = [], debris = [], mirrors = [], gates = [];
  let gk = 0;
  L.map.forEach((row, y) => [...row].forEach((ch, x) => {
    const i = idxOf(w, x, y);
    if (ch === 'C'){ base[i] = CORE; core.push(i); }
    else if (ch === '#'){ base[i] = DEBRIS; debris.push(i); }
    else if (ch === '/' || ch === '\\'){ base[i] = ch === '/' ? MIRROR_A : MIRROR_B; mirrors.push(i); }
    else if (ch === 'g' || ch === 'G'){ base[i] = GATE; gate[i] = L.gates[gk++]; gates.push(i); if (ch === 'G') bp[i] = HULL; }

  const P = CFG.CROP_PAD; x0 = Math.max(0, x0 - P); y0 = Math.max(0, y0 - P); x1 = Math.min(w - 1, x1 + P); y1 = Math.min(h - 1, y1 + P);
  const W2 = x1 - x0 + 1, H2 = y1 - y0 + 1, map = (i) => { const x = i % w, y = (i - x) / w; return idxOf(W2, x - x0, y - y0); };
  const pick = (arr) => { const out = new Array(W2 * H2); for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) out[idxOf(W2, x, y)] = arr[idxOf(w, x + x0, y + y0)]; return out; };
  const lanes = lay.lanes.map(l => ({ side: l.side, idx: l.idx - (l.side === 'L' || l.side === 'R' ? y0 : x0), q: l.q.slice() }));
  for (const l of lanes) if (l.idx < 0 || l.idx >= (l.side === 'L' || l.side === 'R' ? H2 : W2)) throw new Error('очередь ' + l.side + l.idx + ' за обрезкой поля');
  // деталь вида может смотреть за край поля — храним клетку как координаты (x, y), а не индекс
  const deco = (lay.deco || []).map(d => { const x = d.i % w, y = (d.i - x) / w; return { t: d.t, x: x - x0, y: y - y0, d: d.d }; });
  return Object.assign({}, lay, { w: W2, h: H2, bp: pick(lay.bp), grp: pick(lay.grp), gate: pick(lay.gate), base: pick(lay.base),
    core: lay.core.map(map), debris: lay.debris.map(map), mirrors: lay.mirrors.map(map), gates: lay.gates.map(map), lanes, deco });
}

// Генератор «от решения» по форме объекта: чертёж задан каталогом (OBJECTS), генератор расставляет препятствия
// и ищет порядок постройки — каждый шаг это модуль из какой-то очереди, который при текущей станции честно встаёт
// в свою клетку чертежа рядом со станцией. Порядок постройки и есть решение, поэтому уровень решаем.
// p: obj — объект каталога, flip — зеркало (по умолчанию по сиду, у симметричных нет), solar — доля панелей среди '*',
// debris/mirrors/gates — сколько препятствий.
function genObject(p, seed){
  const T = OBJECTS[p.obj]; if (!T) return null;
  const rnd = mulberry32(seed), th = T.map.length, tw = T.map[0].length;
  const flip = p.flip !== undefined ? !!p.flip : (!T.sym && rnd() < 0.5);
  const M = 1, W = tw + 2 * M, H = th + 2 * M, N = W * H;
  const base0 = new Array(N).fill(EMPTY), bp = new Array(N).fill(0), grp = new Array(N).fill(0);
  const core = [];
  let base = base0, gate = [], debris = [], mirrors = [], gates = [];
  for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++){
    const ch = T.map[y][flip ? tw - 1 - x : x], i = idxOf(W, x + M, y + M);
    if (ch === 'C'){ base0[i] = CORE; core.push(i); }
    else if (ch >= '1' && ch <= '9'){ bp[i] = TRUSS; grp[i] = +ch; }
    else if (ch === '*') bp[i] = p.solar && rnd() < p.solar ? SOLAR : HULL;
    else if (KIND_CH[ch]) bp[i] = KIND_CH[ch];
  }
  // препятствия — в пустых клетках рамки объекта (узкий объект — ещё по клетке слева и справа, сверху и снизу всегда)
  const ex = tw < CFG.OBS_WIDE ? 1 : 0, zone = [], cx = core[0] % W, cy = (core[0] - cx) / W;
  for (let y = M - 1; y < M + th + 1; y++) for (let x = M - ex; x < M + tw + ex; x++){ const i = idxOf(W, x, y); if (base0[i] === EMPTY && !bp[i]) zone.push(i); }
  const nMods = bp.filter(k => k === HULL || k === SOLAR).length + new Set(grp.filter(g => g > 0)).size;   // модулей (ферма — один)
  const place = (count, minR, put) => {
    for (let k = 0, guard = 0; k < (count || 0) && guard < 300 && zone.length; guard++){
      const i = zone[Math.floor(rnd() * zone.length)], x = i % W, y = (i - x) / W;
      if (base[i] !== EMPTY || Math.max(Math.abs(x - cx), Math.abs(y - cy)) < minR) continue;
      put(i); k++;
    }
  };
  const cellsLeft = bp.filter(k => k > 0).length;
  // препятствие может перекрыть клетке все подлёты — тогда переставляем препятствия (до GEN_LAYOUTS раз)
  for (let layout = 0; layout < CFG.GEN_LAYOUTS; layout++){
  base = base0.slice(); gate = new Array(N).fill(0); debris = []; mirrors = []; gates = [];
  place(p.debris, CFG.DEBRIS_MIN_R, (i) => { base[i] = DEBRIS; debris.push(i); });
  place(p.mirrors, 1, (i) => { base[i] = rnd() < 0.5 ? MIRROR_A : MIRROR_B; mirrors.push(i); });
  place(p.gates, 1, (i) => { base[i] = GATE; gate[i] = 2 + Math.floor(rnd() * Math.max(1, Math.min(4, nMods - 4))); gates.push(i); });
  for (let attempt = 0; attempt < CFG.GEN_TRIES; attempt++){
    const occ = base.slice(), laneOf = {}, order = [];
    let left = cellsLeft, debrisHits = 0, mirrorHits = 0, gateUses = 0, trusses = 0;
    while (left > 0){
      const f = { occ, w: W, h: H, gate, docks: order.length }, cands = []; let wsum = 0;
      for (const kind of [HULL, SOLAR, TRUSS]){
        const len = MOD_LEN[kind];
        for (const side of SIDES) for (let idx = 0, n = side === 'L' || side === 'R' ? H : W; idx < n; idx++){
          const key = side + idx, ln = laneOf[key], depth = side === 'L' || side === 'R' ? CFG.DEPTH_LR : CFG.DEPTH_TB;
          const used = ln ? ln.q.reduce((a, k) => a + MOD_LEN[k], 0) : 0;
          if (used + len > depth) continue;
          const t = trace(f, side, idx, len);
          if (t.stop < 0 || t.hit < 0 || !fits(bp, grp, kind, t.cells)) continue;
          if (!Math.max(...t.cells.map(c => stationNb(occ, W, H, c)))) continue;      // касается станции, а не висит у обломка
          const viaGate = t.path.some(c => base[c] === GATE) || occ[t.hit] === GATE;
          let w = 1;
          if (ln) w *= CFG.GEN_QUEUE_W;
          if (occ[t.hit] === DEBRIS) w *= CFG.GEN_DEBRIS_W;
          if (t.turns.length) w *= CFG.GEN_MIRROR_W;
          if (viaGate) w *= CFG.GEN_GATE_W;
          cands.push({ side, idx, key, kind, t, w, viaGate }); wsum += w;
        }
      }
      if (!cands.length) break;
      let r = rnd() * wsum, pick = cands[cands.length - 1];
      for (const c of cands){ r -= c.w; if (r <= 0){ pick = c; break; } }
      for (const c of pick.t.cells) occ[c] = pick.kind;
      left -= pick.t.cells.length;
      if (pick.kind === TRUSS) trusses++;
      if (occ[pick.t.hit] === DEBRIS) debrisHits++;
      if (pick.t.turns.length) mirrorHits++;
      if (pick.viaGate) gateUses++;
      if (!laneOf[pick.key]) laneOf[pick.key] = { side: pick.side, idx: pick.idx, q: [] };
      laneOf[pick.key].q.push(pick.kind); order.push(pick.key);
    }
    if (left > 0) continue;
    const lanes = Object.values(laneOf).sort((a, b) => SIDES.indexOf(a.side) - SIDES.indexOf(b.side) || a.idx - b.idx);
    return { w: W, h: H, bp, grp, gate, base, core, debris, mirrors, gates, lanes, order, debrisHits, mirrorHits, gateUses, trusses,
      obj: p.obj, flip, name: T.name, deco: decoCells(T.deco, W, M, M, flip ? tw : 0), attempt, layout };
  }
  }
  return null;
}

const layCache = new Map();
function layoutOf(li){
  if (!layCache.has(li)){ const L = LEVELS[li]; layCache.set(li, cropLayout(L.map ? parseMap(L) : genObject(L.gen, L.seed))); }
  return layCache.get(li);
}
function stateFromLayout(lay, li){
  const total = lay.bp.filter(k => k > 0).length;
  return { li, w: lay.w, h: lay.h, bp: lay.bp, grp: lay.grp, gate: lay.gate, base: lay.base, lanes: lay.lanes, core: lay.core,
    debris: lay.debris, mirrors: lay.mirrors, gates: lay.gates, name: lay.name || '', deco: lay.deco || [],
    occ: lay.base.slice(), ptr: lay.lanes.map(() => 0), bat: CFG.BATTERIES, placed: 0, total,
    moves: 0, misses: 0, undos: 0, hist: [], last: null, dead: false };
}
function createState(li){ return stateFromLayout(layoutOf(li), li); }
function cloneState(s){ return { ...s, occ: s.occ.slice(), ptr: s.ptr.slice(), hist: s.hist.slice() }; }

// Куда встанет передний модуль очереди li — честный расчёт того же ядра (им же рисуется превью).
function landing(s, li){
  const ln = s.lanes[li]; if (!ln || s.ptr[li] >= ln.q.length) return null;
  const kind = ln.q[s.ptr[li]], t = trace(fieldOf(s), ln.side, ln.idx, MOD_LEN[kind]);
  const res = t.hit < 0 ? 'off' : t.stop < 0 ? 'blocked' : fits(s.bp, s.grp, kind, t.cells) ? 'dock' : 'crooked';
  return { li, kind, res, cell: t.stop, cells: t.cells, hit: t.hit, path: t.path, turns: t.turns, dir: t.dir };
}
function legalMoves(s){ const out = []; if (isWin(s)) return out; s.ptr.forEach((p, li) => { if (p < s.lanes[li].q.length) out.push(li); }); return out; }

// Перебор порядка стыковок (только удачные стыковки; промахи состояние не меняют). Мемо по занятости + очередям.
function solveInfo(s){
  const occ = s.occ.slice(), ptr = s.ptr.slice(), lanes = s.lanes, bp = s.bp, seen = new Set(), path = [];
  const f = { occ, w: s.w, h: s.h, gate: s.gate, docks: s.hist.length };
  let left = s.total - s.placed, nodes = 0, capped = false;
  function rec(){
    if (left === 0) return true;
    const key = ptr.join(',') + '|' + occ.join('');
    if (seen.has(key)) return false;
    seen.add(key);
    if (++nodes > CFG.SOLVE_CAP){ capped = true; return false; }
    for (let li = 0; li < lanes.length; li++){
      const ln = lanes[li]; if (ptr[li] >= ln.q.length) continue;
      const kind = ln.q[ptr[li]], t = trace(f, ln.side, ln.idx, MOD_LEN[kind]);
      if (t.hit < 0 || t.stop < 0 || !fits(bp, s.grp, kind, t.cells)) continue;
      for (const c of t.cells) occ[c] = kind; ptr[li]++; left -= t.cells.length; f.docks++; path.push(li);
      if (rec()) return true;
      for (const c of t.cells) occ[c] = s.base[c]; ptr[li]--; left += t.cells.length; f.docks--; path.pop();
      if (capped) return false;
    }

  }

}
function solve(s){ return solveInfo(s).path; }
function isDead(s){ if (isWin(s)) return false; const r = solveInfo(s); return !r.path && r.exact; }

function applyMove(s, li){
  const L = landing(s, li); if (!L || isWin(s) || isLose(s)) return s;
  const n = cloneState(s); n.moves++; n.last = L;
  if (L.res === 'dock'){ for (const c of L.cells) n.occ[c] = L.kind; n.ptr[li]++; n.placed += L.cells.length; n.hist.push({ li, cell: L.cell, cells: L.cells }); n.dead = isDead(n); }
  else { n.bat -= CFG.MISS_COST; n.misses++; }
  return n;
}
function canUndo(s){ return s.hist.length > 0 && !isWin(s) && s.bat > CFG.UNDO_COST; }
function undoMove(s){
  if (!canUndo(s)) return s;
  const n = cloneState(s), h = n.hist.pop();
  for (const c of h.cells) n.occ[c] = s.base[c]; n.ptr[h.li]--; n.placed -= h.cells.length; n.bat -= CFG.UNDO_COST; n.undos++;
  n.last = { li: h.li, res: 'undo', cell: h.cell, cells: h.cells, kind: s.occ[h.cell] }; n.dead = isDead(n);

}
function isWin(s){ return s.placed === s.total; }
// Проигрыш: батарейки кончились, или тупик, а на отмену батареек уже не хватает.
function isLose(s){ return !isWin(s) && (s.bat <= 0 || (s.dead && s.bat <= CFG.UNDO_COST)); }
function starsFor(s){ return Math.max(1, Math.min(3, s.bat)); }

// Боты (PROTO-BASE §6). Случайный — тапает любую очередь. Новичок — тапает наугад среди тех, что встанут
// в пунктир (траекторию он видит), в тупике отменяет и больше этот ход в этом месте не делает.
// Жадный — выбирает стыковку, после которой остаётся больше удачных вариантов.
function randomRun(li, seed){
  const rnd = mulberry32(seed); let s = createState(li);
  while (!isWin(s) && !isLose(s)){ const m = legalMoves(s); s = applyMove(s, m[Math.floor(rnd() * m.length)]); }
  return { win: isWin(s), moves: s.moves, bat: s.bat };
}
function noviceOn(s, seed){
  const rnd = mulberry32(seed), banned = new Set(); let dead = 0;
  const key = (st) => st.ptr.join(',') + '|' + st.occ.join('');
  while (!isWin(s) && !isLose(s)){
    const k = key(s), m = dockMoves(s).filter(li => !banned.has(k + '>' + li));
    if (!m.length){ if (canUndo(s)) { s = undoMove(s); continue; } break; }
    const li = m[Math.floor(rnd() * m.length)], n = applyMove(s, li);
    if (n.dead){ dead++; banned.add(k + '>' + li); s = canUndo(n) ? undoMove(n) : n; }
    else s = n;
  }
  return { win: isWin(s), clean: isWin(s) && dead === 0, deadEnds: dead, undos: s.undos, bat: s.bat, moves: s.moves };
}
function noviceRun(li, seed){ return noviceOn(createState(li), seed); }
function greedyRun(li){
  let s = createState(li);
  while (!isWin(s) && !isLose(s)){
    const m = dockMoves(s); if (!m.length) break;
    let best = m[0], bestN = -1;
    for (const li2 of m){ const n = applyMove(s, li2), v = n.dead ? -1 : dockMoves(n).length; if (v > bestN){ bestN = v; best = li2; } }
    s = applyMove(s, best);
  }
  return { win: isWin(s), moves: s.moves, bat: s.bat };
}
// Метрики уровня для подбора сида и аудита: доля чистых побед новичка, побед с отменами, побед случайного.
function levelMetrics(s0, runs, seed){
  let clean = 0, win = 0, rnd = 0, opts = 0, dec = 0;
  for (let k = 0; k < runs; k++){
    const r = noviceOn(cloneState(s0), seed * 7919 + k); clean += r.clean ? 1 : 0; win += r.win ? 1 : 0;
  }
  for (let k = 0; k < runs; k++){
    const r2 = mulberry32(seed * 31 + k); let s = cloneState(s0);
    while (!isWin(s) && !isLose(s)){ const m = legalMoves(s); s = applyMove(s, m[Math.floor(r2() * m.length)]); }
    rnd += isWin(s) ? 1 : 0;
  }
  // очевидность: сколько очередей в среднем «зелёные» по ходу решения

  for (const li of sol){ opts += dockMoves(s).length / legalMoves(s).length; dec++; s = applyMove(s, li); }

// Уровень после 20-го (бесконечный режим и проверка «1000-го уровня»): объект по кругу каталога, препятствия по номеру.
function paramsFor(n){
  const ids = Object.keys(OBJECTS), obj = ids[(n * 7) % ids.length], ch2 = /[1-9]/.test(OBJECTS[obj].map.join(''));
  return { obj, solar: 0.4, debris: n % 4 === 1 ? 1 : 0, mirrors: n % 3 === 0 ? 2 : n % 3 === 1 ? 1 : 0, gates: ch2 || n % 5 === 0 ? 1 : 0 };
}

// ---------------------------------------------------------------------------
// Оболочка: экраны, ввод, 3D-кадр, звук, сейв, дебаг-хук. Время абсолютное (§4): все анимации — дедлайны по clock(),
// clock() = реальное время × скорость + прогон drive(). Мировые координаты: клетка = 1, поле в XZ с центром в нуле.

const VERSION = '1.2.2';

const SAVE_KEY = NAME + '.v1';

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8). Отдельные события: лязг защёлок, раскрытие панелей, свет ---

// Финал проверяется по состоянию в каждом кадре, а не по событию (урок lesson-ending-after-return-anim)
function checkEnding(now){
  const s = G.s; if (!s || G.ending || G.screen !== 'game') return;
  const busy = G.flights.some(f => !f.arrived || (f.back1 && f.back1 > now));
  if (isWin(s) && !G.flights.some(f => !f.arrived)){
    const last = Math.max(0, ...Object.values(G.cellFx).map(f => f.t0));
    G.ending = { kind: 'win', at: Math.max(now + 150, last + CFG.LATCH_MS + CFG.UNFOLD_MS) };
    log('event', 'level.win', 'level=' + (s.li + 1) + ' bat=' + s.bat + ' taps=' + s.moves); hud();
  } else if (isLose(s) && !busy){

// Идёт полёт, возврат после промаха или отмена: в это время новая отмена не принимается (иначе два модуля едут на одну площадку)

  const kind = s.occ[h.cell], a = { x: cx(h.cells[0]), z: cz(h.cells[0]) }, b = h.cells[1] !== undefined ? { x: cx(h.cells[1]), z: cz(h.cells[1]) } : a;

// Победа: свет волной от ядра → детали вида достраиваются по одной → объект улетает в ангар → карточка со снимком

      G.fx.push({ type: 'ring', x: c0.x, z: c0.z, t0: now, t1: now + 900, r0: 0.5, r1: 4, col: '#b8f4ff' });
      G.decoAt = s.deco.map((d, k) => now + 350 + k * CFG.DECO_STEP_MS);

}

// Награда сохраняется один раз за партию — и когда финал досмотрен, и когда игрок ушёл с поля посреди него
function commitWin(s){
  if (!s || G.rewarded === G.runId) return; G.rewarded = G.runId;
  const li = s.li, stars = starsFor(s);
  G.save.best[li] = Math.max(G.save.best[li] || 0, stars);
  G.save.open = Math.max(G.save.open, Math.min(li + 1, LEVELS.length - 1));
  G.save.level = Math.min(li + 1, LEVELS.length - 1);
  if (!G.save.hangar.includes(li)) G.save.hangar.push(li);
  save(); log('event', 'reward', 'stars=' + stars + ' hangar=' + G.save.hangar.length);
}
// Уход с поля посреди финала (меню, заново, другой уровень): награду сохранить, презентацию снять — карточка не всплывёт потом

  if (!G.ending) return;

// --- ввод: Pointer Events на 2D-слое; палец на очереди показывает траекторию, отпустил — летит (§3) ---
const fxc = $('fx'), fctx = fxc.getContext('2d');

// --- размер: resize + orientationchange + периодический пересчёт (§2); DPR ≤ 2 с откатом, если кадр тяжёлый ---

  cssW = r.width; cssH = r.height; DPR = dpr;

}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(() => fit(), 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(() => fit(), 800);

function adaptDpr(ms){                                   // откат DPR: 2 → 1.5 → 1, если 90-й перцентиль интервала кадров > 24 мс (меньше ~42 к/с)
  G.frameMs.push(ms); if (G.frameMs.length < 90) return;

  if (p90 > 24 && G.dprCap > 1){ G.dprCap = G.dprCap > 1.5 ? 1.5 : 1; log('event', 'dpr.down', 'cap=' + G.dprCap + ' p90=' + p90.toFixed(1)); fit(true); }
}

// --- цвета: CSS-переменные (§9) и цвета 3D ---
const cssCache = {};
function getCss(name){ return cssCache[name] || (cssCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#f0f'); }
const easeU = (u) => u < 0 ? 0 : u > 1 ? 1 : u;
const easeOut = (u) => 1 - Math.pow(1 - easeU(u), 3);

const bump = (u) => u <= 0 || u >= 1 ? 0 : Math.sin(u * Math.PI) * (1 - u);
let C3 = null;                                            // цвета 3D (THREE.Color) — после загрузки сцены

    red: c('#ff5a6e'), redTint: c('#ff8080'), dim: c('#4a4f78'), white: c('#ffffff'),
    bpHull: c('#46e6ff'), bpSolar: c('#ffd23d'), bpTruss: c('#ff9a3d'), ok: c('#5cf28a'), bad: c('#ff5a6e'), holo: c('#5fe8ff'),
    trail: [c('#9fdcff', 0.7), c('#9fdcff', 0.4), c('#9fdcff', 0.18)], ghostOk: c('#5cf28a', 0.9), ghostBad: c('#ff5a6e', 0.9), fieldK: [0, 1, 2, 3].map(k => c('#7a46ff', 0.4 + 0.06 * k)), holoK: [0.3, 0.45, 0.6, 0.75, 0.8].map(k => c('#5fe8ff', k)), holoRing: [0.15, 0.25, 0.35].map(k => c('#5fe8ff', k)),
    flame: c('#ffb347'), flameCool: c('#7fd0ff'), field: c('#9a62ff'), lampMast: c('#ff6a3d', 1.4), shadow: c('#ffffff'), gold: c('#ffd36b') };

// --- 3D-кадр: игра расставляет модели в пулы (R3.put) по своему состоянию и дедлайнам ---
// Детали вида: точка крепления у края клетки (мир) и курс наружу
function decoPos(d){
  const s = G.s, x = d.x - (s.w - 1) / 2, z = d.y - (s.h - 1) / 2, v = d.d ? DIR[{ T: 'B', B: 'T', L: 'R', R: 'L' }[d.d]] : [0, 0];   // DIR[сторона входа] — внутрь; наружу — противоположная
  return { x: x + v[0] * 0.5, z: z + v[1] * 0.5, yaw: d.d ? yawOf(v) : 0, cx: x, cz: z };
}
const DECO_MODEL = { nose: 'nose', engine: 'engine', fin: 'fin', dish: 'dish', mast: 'mast', leg: 'leg', ring: 'ringDeco' };
// Перенос всей станции при улёте в ангар: подъём, уход вглубь, уменьшение (центр — ядро)
function liftXf(now){
  if (!G.liftAt || now < G.liftAt) return null;
  const u = easeIn((now - G.liftAt) / CFG.LIFT_MS), c = G.s.core[0];
  return { u, cx: cx(c), cz: cz(c), up: u * 9, back: u * 4, sc: 1 - 0.6 * u };
}
function X(xf, x, y, z){ if (!xf) return [x, y, z]; return [xf.cx + (x - xf.cx) * xf.sc, y * xf.sc + xf.up, xf.cz + (z - xf.cz) * xf.sc - xf.back]; }
function putM(name, x, y, z, yaw, sc, tint, lamp, mode, xf, rx, rz){
  const p = X(xf, x, y, z), k = xf ? xf.sc : 1;
  R3.put(name, R3.mat(p[0], p[1], p[2], yaw, Array.isArray(sc) ? sc.map(v => v * k) : (sc === undefined ? 1 : sc) * k, rx, rz), tint, lamp, mode);
}
// Один модуль (капсула/панель/ферма) в точке: курс, масштаб, раскрытие крыльев (0 — сложены, 1 — раскрыты), свет окон
function putModule(kind, x, z, yaw, sc, o){
  o = o || {};
  const xf = o.xf, y = o.y || 0, sq = o.sq || [1, 1, 1], ln = kind === TRUSS && o.len ? o.len : 1, s3 = [sc * sq[0] * ln, sc * sq[1], sc * sq[2]];   // ln — ферма сложена (очередь) или раздвигается (полёт)
  if (o.mode){                                             // призрак / голограмма
    const nm = kind === TRUSS ? 'truss' : kind === SOLAR ? 'solarHub' : 'hull';
    putM(nm, x, y, z, yaw, s3, o.col, null, o.mode, xf);
    if (kind === SOLAR) for (const side of [-1, 1]) putWing(x, y, z, yaw, s3, side, o.unfold === undefined ? 1 : o.unfold, o.col, o.mode, xf);
    return;
  }
  if (kind === TRUSS) putM('truss', x, y, z, yaw, s3, o.tint, o.lamp || C3.lampMast, null, xf);
  else if (kind === SOLAR){ putM('solarHub', x, y, z, yaw, s3, o.tint, o.lamp || C3.cool, null, xf); for (const side of [-1, 1]) putWing(x, y, z, yaw, s3, side, o.unfold === undefined ? 1 : o.unfold, o.tint, null, xf); }
  else putM('hull', x, y, z, yaw, s3, o.tint, o.lamp || C3.cool, null, xf);
  if (o.nozzle){                                           // сопло сзади (+ пламя): очередь и полёт
    const back = (kind === TRUSS ? 0.93 * ln : kind === SOLAR ? 0.37 : 0.48) * sc, bx = x - Math.cos(yaw) * back, bz = z + Math.sin(yaw) * back;
    putM('nozzle', bx, Y_MOD * sc + y, bz, yaw, sc * (o.nz === undefined ? 1 : o.nz), o.tint, null, null, xf);
    if (o.flame > 0) putM('flame', bx - Math.cos(yaw) * 0.16 * sc, Y_MOD * sc + y, bz + Math.sin(yaw) * 0.16 * sc, yaw, [sc * o.flame, sc * (0.7 + 0.3 * o.flame), sc * (0.7 + 0.3 * o.flame)], o.flameCol || C3.flame, null, null, xf);
  }
}
// Крыло панели: шарнир у верхнего края хаба; сложено — лежит на хабе, перевернувшись на 180° (второе крыло — поверх первого),
// раскрыто — лежит в сторону
function putWing(x, y, z, yaw, s3, side, unfold, tint, mode, xf){
  // по очереди, чтобы не проходили друг сквозь друга: сначала верхнее крыло стопки (side −1), потом нижнее; складываются в обратном порядке
  const u = unfold >= 1 ? unfold : side < 0 ? Math.min(1, unfold / 0.6) : Math.max(0, (unfold - 0.4) / 0.6);
  const ang = (1 - u) * Math.PI * 0.985, hz = 0.17 * s3[2], lift = side < 0 ? 0.06 * s3[1] * (1 - easeU(u * 3)) : 0;
  const lx = Math.sin(yaw) * hz * side, lz = Math.cos(yaw) * hz * side;                    // ось +Z модели в мире: (sin yaw, cos yaw)
  // крыло уходит в +Z (side 1) или −Z (side −1): для −1 разворот на π вокруг Y
  putM('solarWing', x + lx, (Y_MOD + 0.235) * s3[1] + y + lift, z + lz, yaw + (side < 0 ? Math.PI : 0), s3, tint, null, mode, xf, -ang, 0);
}

function render3D(now){
  const s = G.s; if (!s || !R3.ready) return;
  R3.begin();
  const intro = easeU((now - G.introAt) / CFG.INTRO_MS), c0 = s.core[0], xf = liftXf(now);
  const coreX = cx(c0), coreZ = cz(c0), dead = G.loseAt ? Math.min(1, (now - G.loseAt) / 600) : 0;
  const blink = G.loseAt && Math.floor((now - G.loseAt) / 140) % 2 === 0 && now - G.loseAt < 700;
  const tintDead = dead ? (blink ? C3.redTint : C3.dim) : null;
  const introAt = (i) => easeOutBack((now - G.introAt - Math.hypot(cx(i) - coreX, cz(i) - coreZ) * 70) / 380);
  const press = G.pressL;
  const hot = new Map(); if (press) for (const c of press.cells) hot.set(c, press.res === 'dock' ? C3.ok : C3.bad);
  const winU = G.winAt ? (now - G.winAt) : -1;
  const lampOf = (i, base) => {                                           // свет окон: волна от ядра на победе, гаснет на проигрыше
    if (dead) return blink ? C3.red : C3.off;
    if (winU >= 0){ const w = winU - Math.hypot(cx(i) - coreX, cz(i) - coreZ) * CFG.WIN_WAVE_MS; return w > 0 && w < 260 ? C3.winHot : base; }   // огни победы — тёплые, не зелёные
    for (const wv of G.waves){ const w = now - wv.t0 - Math.hypot(cx(i) - wv.x, cz(i) - wv.z) * CFG.DOCK_WAVE_MS; if (w > 0 && w < 150) return C3.litHot; }   // стыковка: огни вспыхивают волной от шва (у каждой стыковки своя волна)
    return base;
  };
  // волна света от шва (0..1 в точке): модуль на миг крупнее и ярче, под ним зелёный отсвет
  const waveAt = (x, z) => { let m = 0; for (const wv of G.waves){ const w = now - wv.t0 - Math.hypot(x - wv.x, z - wv.z) * CFG.DOCK_WAVE_MS; if (w > 0 && w < 240) m = Math.max(m, Math.sin(w / 240 * Math.PI)); } return m; };
  // толчок станции от удара: смещение вдоль удара идёт волной от шва и затухает (пружина), KN — [dx, dz]
  const knock = (x, z) => { KN[0] = 0; KN[1] = 0;
    for (const k of G.knocks){ const dist = Math.hypot(x - k.x, z - k.z), t = now - k.t0 - dist * CFG.KNOCK_WAVE_MS; if (t <= 0 || t > 420) continue;
      const a = k.amp * CFG.KNOCK_U / (1 + dist * 0.7) * Math.sin(t / 30) * Math.exp(-t / 95); KN[0] += k.d[0] * a; KN[1] += k.d[1] * a; }
    return KN; };
  R3.board(easeU((now - G.introAt) / 500) * (xf ? Math.max(0, 1 - xf.u * 4) : 1) * (dead ? 1 - 0.6 * dead : 1));   // силуэт и узлы сетки: проявляются на старте, гаснут с улётом вещи
  // --- стартовые площадки (только под передним модулем очереди) и стрелки «куда полетит» ---
  s.lanes.forEach((ln, li) => {
    let u = easeOutBack((now - G.introAt - 200 - li * 25) / 400);
    const live = s.ptr[li] < ln.q.length, gone = !live && !G.flights.some(f => f.li === li && (now < f.t1 || (f.back1 && now < f.back1)));

    else if (press.cells.length){ const a = []; for (const i of press.cells) for (const [ox, oz] of [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]]) a.push(P(cx(i) + ox, 0.02, cz(i) + oz));
      const mx = (Math.max(...a.map(p => p.x)) + Math.min(...a.map(p => p.x))) / 2, my = (Math.max(...a.map(p => p.y)) + Math.min(...a.map(p => p.y))) / 2;
      // уголки прицела — по экранной рамке углов клеток посадки (при любом наклоне камеры рамка обнимает клетку целиком)
      const rx = (Math.max(...a.map(p => p.x)) - Math.min(...a.map(p => p.x))) / 2 + cp * 0.03, ry = (Math.max(...a.map(p => p.y)) - Math.min(...a.map(p => p.y))) / 2 + cp * 0.03;
      const k2 = cp * 0.16, sn = 1 + 0.06 * Math.sin(now / 90);
      c.strokeStyle = col; c.lineWidth = 3.5; c.lineCap = 'round';
      for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]){ const X0 = mx + sx * rx * sn, Y0 = my + sy * ry * sn; c.beginPath(); c.moveTo(X0 - sx * k2, Y0); c.lineTo(X0, Y0); c.lineTo(X0, Y0 - sy * k2); c.stroke(); } }
  }
  // счётчики силовых полей
  for (const i of s.gates){
    const left = s.gate[i] - G.docksShown; if (left <= 0 || G.liftAt) continue;
    const sp = P(cx(i), 0.85, cz(i)), r = Math.max(11, cp * 0.2);
    c.fillStyle = '#2a1260'; c.strokeStyle = '#c9a4ff'; c.lineWidth = 2.5; c.beginPath(); c.arc(sp.x, sp.y, r, 0, 6.283); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.font = '900 ' + Math.round(r * 1.25) + 'px Nunito, system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(left), sp.x, sp.y + 1);
  }
  // значки «следующий» у боковых очередей: тип — тем же знаком и цветом, что гнездо чертежа
  if (!G.liftAt && !G.loseAt) s.lanes.forEach((ln, li) => {
    if (!isLR(ln.side)) return;
    const o = qOffsets(ln, s.ptr[li]);
    for (const q of o){ if (!q.chip) continue;
      const iu = easeOutBack((now - G.introAt - 420) / 380); if (iu <= 0) continue;
      const w = slotAt(ln, q.off, q.lat), sp = P(w.x, 0.3, w.z);
      drawChip(c, sp.x, sp.y, q.sc * cp * iu, ln.q[q.k]); }
  });
  // частицы
  G.parts = G.parts.filter(p => now < p.t1);
  for (const p of G.parts){
    if (now < p.t0) continue;
    const q = partPos(p, now), sp = P(q.x, q.y, q.z), u = (now - p.t0) / (p.t1 - p.t0), r = Math.max(1, p.r * cp);
    c.globalAlpha = Math.max(0, 1 - u);
    if (p.type === 'puff'){ c.fillStyle = p.col; c.beginPath(); c.arc(sp.x, sp.y, r * (1 + u * 1.6), 0, 6.283); c.fill(); }
    else if (p.type === 'streak'){ const q0 = partPos(p, now - 26), s0 = P(q0.x, q0.y, q0.z); c.strokeStyle = p.col; c.lineCap = 'round'; c.lineWidth = Math.max(1.5, r * (1.1 - u * 0.6)); c.beginPath(); c.moveTo(s0.x, s0.y); c.lineTo(sp.x, sp.y); c.stroke(); }   // искра-штрих: хвост по скорости
    else if (p.type === 'confetti'){ c.save(); c.translate(sp.x, sp.y); c.rotate(p.rot + p.vr * q.t); c.fillStyle = p.col; c.fillRect(-r, -r * 0.5, r * 2, r); c.restore(); }
    else { c.fillStyle = p.col; c.beginPath(); c.arc(sp.x, sp.y, r * (1 - u * 0.5), 0, 6.283); c.fill(); }
  }
  c.globalAlpha = 1;
  // слова, «−1», кромка экрана
  for (const e of G.fx){
    if (now < e.t0 || now > e.t1) continue;
    const u = (now - e.t0) / (e.t1 - e.t0);
    if (e.type === 'word'){ const sp = P(e.x, e.y, e.z), size = Math.round((e.big ? 30 : 23) * (u < 0.15 ? 0.6 + 0.4 * easeOutBack(u / 0.15) : 1));
      c.globalAlpha = u > 0.7 ? 1 - (u - 0.7) / 0.3 : 1; c.font = '1000 ' + size + 'px Nunito, system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 6; c.strokeStyle = 'rgba(8,10,40,.85)'; const wy = sp.y - cp * 0.55 - 30 * u, wx = Math.max(c.measureText(e.text).width / 2 + 6, Math.min(cssW - c.measureText(e.text).width / 2 - 6, sp.x));   // камера сверху: слово — над модулем, а не на нём; у края экрана не обрезается
      c.strokeText(e.text, wx, wy); c.fillStyle = e.col; c.fillText(e.text, wx, wy); c.globalAlpha = 1; }
    if (e.type === 'batt'){ const sp = P(e.x, 0.6, e.z), y = sp.y + cp * 0.45 - 20 * easeOut(u); c.globalAlpha = 1 - easeU((u - 0.6) / 0.4);   // «−1» — под словом промаха, не поверх него
      c.font = '1000 20px Nunito, system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 5; c.strokeStyle = 'rgba(8,10,40,.85)'; c.strokeText('−1', sp.x + 12, y); c.fillStyle = getCss('--bad'); c.fillText('−1', sp.x + 12, y);
      if (IMG.bat.complete) c.drawImage(IMG.bat, sp.x - 22, y - 14, 18, 28); c.globalAlpha = 1; }
    if (e.type === 'edge'){ c.globalAlpha = (1 - u) * 0.6; c.strokeStyle = getCss('--bad'); c.lineWidth = 10; c.strokeRect(0, 0, cssW, cssH); c.globalAlpha = 1; }
  }
  // подсказка на обучающих уровнях: пульсирующее кольцо у очереди из решения после бездействия
  const L = LEVELS[s.li];
  if (L.hint && L.map && !G.ending && !G.press && G.screen === 'game' && now - G.lastInput > CFG.HINT_IDLE_MS && !G.flights.some(f => !f.arrived)){
    const key = s.ptr.join(',') + '|' + s.hist.length;
    if (G.hintKey !== key){ G.hintKey = key; const sol = solve(s); G.hintLane = sol && sol.length ? sol[0] : -1; }
    if (G.hintLane >= 0){ const fr = frontOf(s, G.hintLane), sp = P(fr.p.x, 0.4, fr.p.z), t = (now / 900) % 1;
      c.strokeStyle = '#fff'; c.lineWidth = 4; c.globalAlpha = 1 - t; c.beginPath(); c.arc(sp.x, sp.y, cp * (0.3 + 0.5 * t), 0, 6.283); c.stroke(); c.globalAlpha = 1;
      if (IMG.hand.complete){ const b = Math.sin(now / 160) * 6; c.drawImage(IMG.hand, sp.x + 6, sp.y + 4 + b, 36, 36); } }
  }
}
// Значок «следующий в очереди»: маленькая площадка (цвета стартовой площадки) с модулем в его настоящих цветах —
// белая капсула с оранжевыми поясами и окном, синяя панель в золотой раме, оранжевая ферма с крестами
function drawChip(c, x, y, size, kind){
  const h = size / 2, r = size * 0.28, u = size / 100;
  c.beginPath(); c.roundRect(x - h, y - h, size, size, r); c.fillStyle = 'rgba(34,42,98,.97)'; c.fill(); c.lineWidth = Math.max(1.5, size * 0.07); c.strokeStyle = '#6f86ea'; c.stroke();
  if (kind === SOLAR){
    c.fillStyle = '#ffc130'; c.beginPath(); c.roundRect(x - 34 * u, y - 24 * u, 68 * u, 48 * u, 8 * u); c.fill();
    c.fillStyle = '#2459e6'; for (const sx of [-1, 1]){ c.beginPath(); c.roundRect(x + (sx < 0 ? -27 : 3) * u, y - 17 * u, 24 * u, 34 * u, 5 * u); c.fill(); }
  } else if (kind === TRUSS){
    c.strokeStyle = '#ff8a1f'; c.lineWidth = 9 * u; c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath(); c.roundRect(x - 34 * u, y - 18 * u, 68 * u, 36 * u, 4 * u); c.stroke();
    c.strokeStyle = '#ffc130'; c.lineWidth = 7 * u; c.beginPath(); for (const sx of [-1, 1]){ c.moveTo(x + sx * 2 * u, y - 14 * u); c.lineTo(x + sx * 28 * u, y + 14 * u); c.moveTo(x + sx * 2 * u, y + 14 * u); c.lineTo(x + sx * 28 * u, y - 14 * u); } c.stroke();
  } else {
    c.fillStyle = '#f4f1fb'; c.beginPath(); c.roundRect(x - 36 * u, y - 23 * u, 72 * u, 46 * u, 23 * u); c.fill();
    c.fillStyle = '#ff8a1f'; for (const sx of [-1, 1]) c.fillRect(x + sx * 20 * u - 4 * u, y - 23 * u, 8 * u, 46 * u);
    c.fillStyle = '#59c8ff'; c.beginPath(); c.arc(x, y, 10 * u, 0, 6.283); c.fill();
  }
}
// Картинки для 2D-слоя (значки GPT): батарейка у «−1», рука подсказки — стрелка-шеврон
const IMG = { bat: new Image(), hand: new Image() };
IMG.bat.src = UI + 'bat-off.png'; IMG.hand.src = UI + 'ic-play.png';

// --- снимок готового объекта (карточка победы и ангар): та же сборка моделей, центр в ядре ---
function thumb(li, holo, fresh){
  if (!R3.ready) return '';
  const key = li + (holo ? 'h' : '');
  if (G.thumbs[key] && !fresh) return G.thumbs[key];
  const lay = layoutOf(li), s0 = G.s;
  G.s = stateFromLayout(lay, li);                                          // помощники cx/cz/decoPos читают G.s
  const c0 = lay.core[0], ox = cx(c0), oz = cz(c0), span = Math.max(lay.w, lay.h) * 0.72 + 0.8;
  const url = R3.snapshot(() => {
    const col = holo ? R3.color('#5fe8ff', 0.7) : null, mode = holo ? 'holo' : null;
    if (!holo){ putM('core', -0, 0, 0, 0, 1, null, C3.core); putM('coreRing', 0, 0, 0, 0.5, 1, null, C3.core); }
    for (let i = 0; i < lay.bp.length; i++){
      const k = lay.bp[i]; if (!k) continue;
      let x = cx(i) - ox, z = cz(i) - oz;
      if (k === TRUSS){ const j = partner(i); if (j < i) continue; x = (cx(i) + cx(j)) / 2 - ox; z = (cz(i) + cz(j)) / 2 - oz; }
      const yaw = k === TRUSS ? (Math.abs(partner(i) - i) === 1 ? 0 : Math.PI / 2) : thumbYaw(lay, i);
      putModule(k, x, z, yaw, 1, holo ? { mode, col, unfold: 1 } : { lamp: k === TRUSS ? C3.lampMast : C3.lit });
    }
    if (!holo) for (let i = 0; i < lay.bp.length; i++){ const st = (j) => lay.base[j] === CORE || lay.bp[j] > 0, x = i % lay.w, y = (i - x) / lay.w; if (!st(i)) continue;
      for (const [dx, dy] of [[1, 0], [0, 1]]){ const j = (y + dy) * lay.w + x + dx; if (x + dx >= lay.w || y + dy >= lay.h || !st(j)) continue;
        if (lay.bp[i] === TRUSS && lay.bp[j] === TRUSS && lay.grp[i] === lay.grp[j]) continue; putM('collar', cx(i) + dx * 0.5 - ox, 0, cz(i) + dy * 0.5 - oz, dx ? 0 : Math.PI / 2, 1); } }
    lay.deco.forEach(d => { const p = decoPos(d); putM(DECO_MODEL[d.t], (d.t === 'ring' ? p.cx : p.x) - ox, 0, (d.t === 'ring' ? p.cz : p.z) - oz, p.yaw, 1, holo ? col : null, C3.lit, mode); });
  }, 256, span);
  G.s = s0;
  return (G.thumbs[key] = url);
}
// Курс капсулы на снимке: вдоль ряда, если соседи по ряду есть, иначе вдоль столбца
// Курс капсулы в готовой вещи (снимок и доворот на победе): вдоль линии, где соседей станции больше; поровну — вертикально
function thumbYaw(lay, i){
  const x = i % lay.w, st = (j) => j >= 0 && j < lay.bp.length && (lay.base[j] === CORE || lay.bp[j] > 0);
  const h = (x > 0 && st(i - 1) ? 1 : 0) + (x < lay.w - 1 && st(i + 1) ? 1 : 0), v = (st(i - lay.w) ? 1 : 0) + (st(i + lay.w) ? 1 : 0);
  return h > v ? 0 : Math.PI / 2;
}
// Ближайший к from угол из двух направлений оси (капсула симметрична: ось, а не курс)
function axisYaw(from, axis){ let best = axis, bd = 9; for (const a of [axis, axis + Math.PI, axis - Math.PI]){ const d = Math.abs(((from - a) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI); if (d < bd){ bd = d; best = from + (((a - from) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI); } } return best; }

// --- игровой цикл: rAF + сторожевой setInterval (§4); всё по абсолютному времени ---
let lastFrame = 0;
function frame(){
  if (G.paused) return;
  // стоп-кадр стыковки: пока он идёт, игровое время стоит (реальное время кадра вычитается из сдвига часов)
  const t0 = performance.now(); if (G.hitStop > G.hsLast) G.skew -= (Math.min(t0, G.hitStop) - G.hsLast) * G.timeScale; G.hsLast = t0;
  const now = clock(); G.frame++;
  if (G.s && G.screen === 'game' || G.ending){
    G.sched = G.sched.filter(e => { if (now >= e.at){ e.fn(); return false; } return true; });
    for (const fl of G.flights) if (!fl.arrived && now >= fl.t1) arrive(fl, now);
    G.flights = G.flights.filter(f => !(f.arrived && now > Math.max(f.t1, f.back1 || 0) + 50));
    G.fx = G.fx.filter(e => now < e.t1);
    for (const k of Object.keys(G.cellFx)) if (now - G.cellFx[k].t0 > 2000) delete G.cellFx[k];
    if (G.waves.length && now - G.waves[0].t0 > 1500) G.waves.shift();
    if (G.knocks.length && now - G.knocks[0].t0 > 700) G.knocks.shift();
    if (now - G.introAt > CFG.INTRO_MS && G.introAt && !G.introDone){ G.introDone = G.introAt; log('fx.end', 'intro'); }
    checkEnding(now);
    if (G.ending && now >= G.ending.at) finishEnding(now);
    if (toastUntil && now > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
  }
  // 3D не рисуется под непрозрачным меню; поле видно только в игре и под карточкой победы/проигрыша
  if (G.s && (G.screen === 'game' || G.screen === 'win' || G.screen === 'lose')){
    G.pressL = G.press && G.press.li >= 0 && G.screen === 'game' && !G.ending ? landing(G.s, G.press.li) : null;   // превью — один расчёт на кадр
    render3D(now); render2D(now);
  }
  lastFrame = performance.now();
}
// Откат DPR — по интервалу между кадрами rAF (он видит и просадку GPU), а не по времени JS кадра
let lastRaf = 0;
// Досъёмка ангара: один снимок за кадр, пока открыт экран ангара
function hangarTick(){
  if (G.screen !== 'hangar' || !G.thumbQueue || !G.thumbQueue.length || !R3.ready) return;
  const i = G.thumbQueue.shift(), got = G.save.hangar.includes(i), src = thumb(i, !got);
  const img = document.querySelector('.hgrid [data-li="' + i + '"] img'); if (img && src){ img.src = src; img.style.visibility = ''; }
}
function loop(ts){ if (lastRaf && G.screen === 'game' && !G.paused){ const d = ts - lastRaf; if (d < 100) adaptDpr(d); } lastRaf = ts; frame(); hangarTick(); requestAnimationFrame(loop); }
setInterval(() => { if (performance.now() - lastFrame > 60) frame(); }, 40);

// --- дебаг-хук (§6) ---
window.STYKOVKA_3D = {
  state(){ const s = G.s; return s && { level: s.li + 1, name: s.name, placed: s.placed, total: s.total, bat: s.bat, moves: s.moves, misses: s.misses, undos: s.undos,
    dead: s.dead, win: isWin(s), lose: isLose(s), screen: G.screen, flights: G.flights.length, ending: G.ending && G.ending.kind, hangar: G.save.hangar.length }; },
  lanes(){ const s = G.s; return s.lanes.map((l, li) => { const L = landing(s, li); return { li, lane: l.side + l.idx, left: l.q.length - s.ptr[li], res: L && L.res }; }); },
  play(n){ startLevel((n || 1) - 1); return this.state(); },
  tap(x){ const s = G.s; const li = typeof x === 'string' ? s.lanes.findIndex(l => l.side + l.idx === x) : x; return launch(li); },
  undo(){ undo(); return this.state(); },
  goto(sc){ if ((sc === 'win' || sc === 'lose') && !G.s) startLevel(G.save.level); goto(sc); return G.screen; },
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },
  solve(){ return (solve(G.s) || []).map(li => G.s.lanes[li].side + G.s.lanes[li].idx); },
  // автоигра: следующий ход решения каждые ms (по реальному времени)
  auto(ms){ clearInterval(this._auto); this._auto = setInterval(() => { if (!G.s || G.screen !== 'game' || G.ending){ return; } if (G.flights.some(f => !f.arrived)) return; const sol = solve(G.s); if (sol && sol.length) launch(sol[0]); else clearInterval(this._auto); }, ms || 500); },
  stop(){ clearInterval(this._auto); },
  drive(sec){ const n = Math.round((sec || 1) * 1000 / 16); for (let k = 0; k < n; k++){ G.skew += 16; frame(); } return this.state(); },
  speed(x){ setSpeed(x); return G.timeScale; },
  hint(){ G.lastInput = -1e9; },
  reset(){ wipeProgress(); goto('menu'); },
  r3(){ return R3.info(); },
  thumb(li, holo){ return thumb((li || 1) - 1, !!holo, true); },
  fit(){ fit(true); return R3.info(); },
  G,
};

// --- старт ---
(function boot(){
  const ok = R3.init && R3.init($('cv3'));
  if (!ok){ $('boot').style.display = 'grid'; log('event', 'r3.error', R3.error || 'no webgl'); }
  else colors3();
  fit(true);
  log('event', 'boot', 'v' + VERSION + ' r3=' + (ok ? 'ok' : 'error'));
  const h = location.hash.slice(1);
  goto('menu'); if (h && h !== 'menu') fromHash();          // #menu раньше оставлял пустой экран: fromHash не открывал уже «текущий» экран
  try { const t = new URLSearchParams(location.search).get('tripo'); if (ok && t) R3.loadTripo(t.split(',')).then(() => { G.thumbs = {}; R3.warm(); log('event', 'tripo', t); }, (e) => log('event', 'tripo.error', String(e))); } catch (e) {}   // проба моделей Tripo
  requestAnimationFrame(loop);
})();
</script>
